# Prepared drop-in only. Not installed or activated.
# Preserve the existing unit's identity, credential sources and sandbox settings.
[Unit]
StartLimitIntervalSec=600
StartLimitBurst=3

[Service]
Type=simple
ExecStart=
ExecStart=/usr/bin/python3 /opt/bevins/bevins_mailpoll.py --run
UMask=0077
StateDirectory=bevins-mailpoll
StateDirectoryMode=0700
ReadWritePaths=/var/lib/bevins-mailpoll
Environment=MAIL_STATE_PATH=/var/lib/bevins-mailpoll/state.sqlite3
Environment=PYTHONDONTWRITEBYTECODE=1
EnvironmentFile=/etc/bevins-mailpoll-policy.env
Restart=on-failure
RestartSec=30
