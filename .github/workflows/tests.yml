name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mail:
    name: mail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mail test dependencies
        working-directory: mail
        run: python -m pip install -r requirements-test.txt
      - name: Run mail tests
        working-directory: mail
        run: python test_mail.py

  app:
    name: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start throwaway Postgres
        run: |
          docker run -d --name bevins-postgres \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 127.0.0.1:5435:5432 postgres:16
          for i in $(seq 1 40); do
            if docker exec bevins-postgres pg_isready -U postgres; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready" >&2
          docker logs bevins-postgres >&2 || true
          exit 1
      - name: Install app test dependencies
        run: python -m pip install -r app/requirements.txt pytest
      - name: Run app regression battery
        working-directory: app/tests
        env:
          BEVINS_APP_PATH: ../app.py
        run: pytest -q
